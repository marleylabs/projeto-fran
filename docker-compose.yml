name: extrato-mensal

services:
  db:
    image: postgres:16-alpine
    container_name: extrato-mensal-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-extrato}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-extrato_mensal}
    volumes:
      - extrato_mensal_db_data:/var/lib/postgresql/data
    ports:
      # Só acessível pela própria máquina — o banco não precisa (e não deve)
      # ficar exposto na rede. Use um túnel SSH se precisar acessar de fora.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-extrato} -d ${POSTGRES_DB:-extrato_mensal}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  extrato-mensal-web:
    container_name: extrato-mensal-web
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-extrato}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-extrato_mensal}
      # "false" só se estiver acessando via HTTP puro (sem proxy reverso/HTTPS na
      # frente) — necessário para o cookie de sessão funcionar, mas a senha e a
      # sessão trafegam sem criptografia. Use HTTPS assim que possível.
      - SECURE_COOKIES=${SECURE_COOKIES:-true}
      - PRIVATE_STORAGE_ROOT=/app/storage
    volumes:
      - financeiro_private_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  document-worker:
    container_name: financeiro-document-worker
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "tsx", "scripts/document-worker.ts"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-extrato}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-extrato_mensal}
      - PRIVATE_STORAGE_ROOT=/app/storage
      - OCR_CACHE_PATH=/app/.cache/tesseract
    volumes:
      - financeiro_private_storage:/app/storage
      - financeiro_ocr_cache:/app/.cache/tesseract
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  extrato_mensal_db_data:
  financeiro_private_storage:
  financeiro_ocr_cache:
